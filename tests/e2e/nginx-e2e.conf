# Local end-to-end environment for indieauth.rocks against myindieauth.com.
# Certificates: /web/sites/indieauth.rocks/storage/e2e-tls (local CA).

server {
  listen 80;
  server_name myindieauth.pad indieauth-rocks.pad redirect.indieauth-rocks.pad e2e-profile.pad;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name myindieauth.pad;
  ssl_certificate     /web/sites/indieauth.rocks/storage/e2e-tls/pad.crt;
  ssl_certificate_key /web/sites/indieauth.rocks/storage/e2e-tls/pad.key;

  root /web/sites/myindieauth.com/public;
  index index.php;
  try_files $uri /index.php?$args;

  location ~* \.php$ {
    fastcgi_pass  php82-pool;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param BASE_URL https://myindieauth.pad/;
    fastcgi_param DB_NAME myindieauth_e2e;
    fastcgi_param REDIS_PREFIX mia_e2e:;
    fastcgi_param REGISTRATION_OPEN 1;
    fastcgi_param ALLOW_LOOPBACK_FETCH 1;
    fastcgi_param LOG_FILE /tmp/myindieauth-e2e.log;
    fastcgi_param PHP_VALUE "curl.cainfo=/web/sites/indieauth.rocks/storage/e2e-tls/ca-bundle.pem";
  }
}

server {
  listen 443 ssl;
  server_name indieauth-rocks.pad redirect.indieauth-rocks.pad e2e-profile.pad;
  ssl_certificate     /web/sites/indieauth.rocks/storage/e2e-tls/pad.crt;
  ssl_certificate_key /web/sites/indieauth.rocks/storage/e2e-tls/pad.key;

  root /web/sites/indieauth.rocks/public;
  index index.php;
  try_files $uri /index.php?$args;

  location ~* \.php$ {
    fastcgi_pass  php82-pool;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param BASE_URL https://indieauth-rocks.pad/;
    fastcgi_param ALT_BASE_URL https://redirect.indieauth-rocks.pad/;
    fastcgi_param FIXTURE_BASE_URL https://e2e-profile.pad/;
    fastcgi_param ALLOW_LOOPBACK_FETCH 1;
    fastcgi_param DEBUG 1;
    fastcgi_param LOG_FILE /tmp/indieauthrocks-e2e.log;
    fastcgi_param PHP_VALUE "curl.cainfo=/web/sites/indieauth.rocks/storage/e2e-tls/ca-bundle.pem";
  }
}
